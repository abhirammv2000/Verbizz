# Template only. deploy-all.sh creates the real secret from the POSTGRES_PASSWORD
# environment variable, so no password is stored in the repository.
# To create it by hand instead:
#   kubectl create secret generic postgres-secret --from-literal=POSTGRES_PASSWORD='your-password'
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
type: Opaque
stringData:
  POSTGRES_PASSWORD: change-me
